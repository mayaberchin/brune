<section id="postEditor" class="post-editor-card d-none">
  <h2 class="mb-2">New Post</h2>
  <p class="text-muted mb-4">
    Write a question, note, or announcement for your class.
  </p>

  <div id="postErrorBox" class="alert alert-danger d-none"></div>

  <form id="postForm">
    <div class="mb-3">
      <label for="postTitle" class="form-label"> Title </label>
      <input
        id="postTitle"
        name="title"
        type="text"
        class="form-control"
        maxlength="120"
        placeholder="What is this post about?"
      >
    </div>

    <div class="mb-3">
      <label for="postType" class="form-label"> Post Type </label>
      <select id="postType" name="postType" class="form-select">
        <option value="question"> Question </option>
        <option value="note"> Note </option>
        <option value="announcement"> Announcement </option>
      </select>
    </div>

    <div class="mb-3">
      <label for="postClass" class="form-label"> Class </label>
      <select id="postClass" name="classId" class="form-select" required>
        <option value=""> Choose a class </option>
        {% for class_info in classes %}
          <option value="{{ class_info.class_id }}">
            {{ class_info.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="postTemplate" name="postTemplate" class="form-label"> Template </label>
      <select id="postTemplate" class="form-select">
        <option value=""> No Template </option>
        <option value="question"> Question </option>
        <option value="debug"> Debugging </option>
        <option value="announcement"> Announcement </option>
      </select>
    </div>

    <div class="mb-3">
      <label for="postBody" class="form-label"> Post Body </label>
      <textarea
        id="postBody"
        name="postBody"
        class="form-control post-body-input"
        placeholder="Type your post here..."
      ></textarea>
    </div>

    <div class="form-check mb-2">
      <input
        id="isAnonymous"
        type="checkbox"
        class="form-check-input"
      >
      <label for="isAnonymous" class="form-check-label"> Post Anonymously </label>
    </div>

    <div class="form-check mb-4">
      <input
        id="shareWithDojo"
        type="checkbox"
        class="form-check-input"
      >
      <label for="shareWithDojo" class="form-check-label"> Share with Dojo </label>
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button
        id="cancelPostButton"
        type="button"
        class="btn btn-outline-secondary"
      >
        Cancel
      </button>

      <button type="submit" class="btn btn-primary"> Post </button>
    </div>
  </form>
</section>

<!-- Bootstrap modal for template confirmation -->
<div class="modal fade" id="templateConfirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h2 class="modal-title fs-5" id="templateConfirmTitle"> Replace current post body? </h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        Applying this template will clear the text currently in the post body.
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal"> Cancel </button>
        <button id="applyTemplateButton" type="button" class="btn btn-primary"> Apply Template </button>
      </div>
    </div>

  </div>
</div>
