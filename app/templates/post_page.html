<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> {{ page_title }} </title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
      rel="stylesheet"
      href="https://unpkg.com/react-quill@1.3.3/dist/quill.snow.css"
    />

    <link rel="stylesheet" href="{{ url_for('static', filename='vite/assets/index.css') }}">
  </head>

  <body class="{{ 'chat-page' if selected_post_type == 'chat' else '' }}">
    <nav class="nav">
      <div class="nav-btn"><a href="{{ url_for('home') }}">Home</a></div>
      <div class="nav-btn {{ 'active' if selected_post_type == 'announcement' else '' }}">
        <a href="{{ url_for('announcements') }}">Announcements</a>
      </div>
      <div class="nav-btn {{ 'active' if selected_post_type == 'chat' else '' }}">
        <a href="{{ url_for('chat') }}">Chat</a>
      </div>
      <div class="nav-btn {{ 'active' if selected_post_type == 'question' else '' }}">
        <a href="{{ url_for('questions') }}">Questions</a>
      </div>
      <div class="nav-btn {{ 'active' if selected_post_type == 'note' else '' }}">
        <a href="{{ url_for('notes_rsrc') }}">Notes</a>
      </div>
      <div class="nav-btn"><a href="{{ url_for('logout') }}">Logout</a></div>
    </nav>

    <div
      id="root"
      data-post-type="{{ selected_post_type }}"
      data-page-title="{{ page_title }}"
      data-page-description="{{ page_description }}"
      data-new-post-label="{{ new_post_label }}"
      data-can-post="{{ 'yes' if can_post else 'no' }}"
      data-current-user-email="{{ current_user_email }}"
    ></div>

   <!-- built Vite js -->
   <script type="module" src="{{ url_for('static', filename='vite/assets/index.js') }}"></script>

 </body>
</html>
