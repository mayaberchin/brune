<!DOCTYPE html>
<html lang="en">
		<head>
				<meta charset="UTF-8">
				<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>My Skills</title>
		</head>
		<body>
				Hello, {{ name }}! <br>
				<a href="{{ url_for('logout') }}">Log Out</a>
				<br><br>
				<table border="1">
						<tr>
								{% for field in fields %}
										<th> {{ field }} </th>
								{% endfor %}
								{% for row in entries %}
										<tr>
												{% for item in row %}
															<td> {{ item }} </td>
												{% endfor %}
										</tr>
								{% endfor %}
						</tr>
				</table>
		</body>
</html>
