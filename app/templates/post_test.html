<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title> Posts Test! </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      .post-editor-card {
        max-width: 850px;
        padding: 24px;
        border: 1px solid grey;
      }

      .post-body-input {
        min-height: 220px;
        max-height: 60vh;
        overflow-y: auto;
      }
    </style>
  </head>

  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1> Posts </h1>

        <button id="newPostButton" class="btn btn-primary">
          + New Post
        </button>
      </div>

      {% include "post_editor.html" %}

      <section id="postsList" class="mt-4">
        <p class="text-muted">
          Posts will show up here later.
        </p>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='js/post_editor.js') }}"></script>

  </body>
</html>
